<div class="container">
  <!-- Map Section (70%) -->
  <div class="map-section">
    <div #mapViewNode class="map-view"></div>
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
      <p>Loading layer...</p>
    </div>

    <!-- Layer Control Button -->
    <app-layer-control-button (toggle)="toggleLayerPanel()"></app-layer-control-button>

    <!-- Layer Control Panel -->
    <div class="layer-panel" [class.open]="isLayerPanelOpen" *ngIf="layerMode === 'layers' || layerMode === 'lazy-loading' || layerMode === 'clustering'">
      <div class="layer-panel-header">
        <h4>Active Layers</h4>
        <button class="close-btn" (click)="toggleLayerPanel()">×</button>
      </div>
      <div class="layer-panel-content">
        <div class="layer-item" *ngFor="let layer of visibleLayerTypes">
          <label class="layer-checkbox">
            <input
              type="checkbox"
              [checked]="isLayerActive(layer.id)"
              (change)="toggleLayer(layer.id)"
              [disabled]="isLoading">
            <span class="layer-color-indicator" [style.background-color]="getLayerColorStyle(layer.id)"></span>
            <span class="layer-name">{{ layer.name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Custom Legend -->
    <div class="map-legend" *ngIf="activeLayerIds.size > 0 && legendType === 'custom'">
      <div class="legend-item" *ngFor="let layerId of activeLayerIds">
        <svg class="legend-icon" width="20" height="20" viewBox="0 0 24 24">
          <g [innerHTML]="getLayerSvgIcon(layerId)"></g>
        </svg>
        <span class="legend-name">{{ getLayerName(layerId) }}</span>
      </div>
    </div>
  </div>

  <!-- Control Panel Component (30%) -->
  <app-control-panel-layers
    *ngIf="layerMode === 'layers'"
    [selectedBasemap]="selectedBasemap"
    [selectedLayerTypeForAll]="selectedLayerTypeForAll"
    [selectedSymbolType]="selectedSymbolType"
    [entitiesAmount]="entitiesAmount"
    [isLoading]="isLoading"
    [basemapOptions]="basemapOptions"
    [totalLoadingTime]="totalLoadingTime"
    [lastLoadedTime]="lastLoadedTime"
    [activeLayerCount]="activeLayerIds.size"
    [history]="history"
    (basemapChange)="onPanelBasemapChange($event)"
    (layerTypeChange)="onPanelLayerTypeChange($event)"
    (symbolTypeChange)="onPanelSymbolTypeChange($event)"
    (entitiesAmountChange)="onPanelEntitiesAmountChange($event)"
    (applySettings)="applySettings()"
    (settingsChange)="onSettingsChange()"
    (historyToggle)="toggleHistory()"
    (historyClear)="clearHistory()"
    (cleanup)="cleanupAllLayers()"
  ></app-control-panel-layers>

  <!-- Lazy Loading Control Panel -->
  <app-contol-panel-lazy-loading
    #lazyLoadingPanel
    *ngIf="layerMode === 'lazy-loading'"
    [activeLayerCount]="activeLayerIds.size"
    [entitiesAmount]="entitiesAmount"
    [totalLoadingTime]="totalLoadingTime"
    [lastLoadedTime]="lastLoadedTime"
    [history]="history"
    (applySettings)="onLazyLoadingApplySettings($event)"
    (cleanup)="cleanupAllLayers()"
  ></app-contol-panel-lazy-loading>

  <!-- Clustering Control Panel -->
  <app-control-panel-clustering
    *ngIf="layerMode === 'clustering'"
    [selectedBasemap]="selectedBasemap"
    [selectedLayerTypeForAll]="selectedLayerTypeForAll"
    [selectedSymbolType]="selectedSymbolType"
    [entitiesAmount]="entitiesAmount"
    [isLoading]="isLoading"
    [basemapOptions]="basemapOptions"
    [totalLoadingTime]="totalLoadingTime"
    [lastLoadedTime]="lastLoadedTime"
    [activeLayerCount]="activeLayerIds.size"
    [history]="history"
    (basemapChange)="onPanelBasemapChange($event)"
    (layerTypeChange)="onPanelLayerTypeChange($event)"
    (symbolTypeChange)="onPanelSymbolTypeChange($event)"
    (entitiesAmountChange)="onPanelEntitiesAmountChange($event)"
    (applySettings)="applySettings()"
    (settingsChange)="onSettingsChange()"
    (clusteringTypeChange)="onPanelClusteringTypeChange($event)"
    (analysisMethodChange)="onPanelAnalysisMethodChange($event)"
    (historyToggle)="toggleHistory()"
    (historyClear)="clearHistory()"
    (cleanup)="cleanupAllLayers()"
  ></app-control-panel-clustering>
</div>
