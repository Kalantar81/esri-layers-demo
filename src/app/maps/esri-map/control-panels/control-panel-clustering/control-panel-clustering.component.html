<div class="control-panel">
  <h3>Control Panel</h3>

  <app-basemap-selector
    [selectedBasemap]="selectedBasemap"
    [basemapOptions]="basemapOptions"
    [disabled]="isLoading"
    (basemapChange)="onBasemapChange($event)">
  </app-basemap-selector>

  <div class="control-group">
    <label for="layerType">Layer Type:</label>
    <select id="layerType" [ngModel]="selectedLayerTypeForAll" (ngModelChange)="onLayerTypeChange($event)" [disabled]="isLoading">
      <option value="geojson">GeoJSON Layer (enable clustering)</option>
      <option value="graphics">Graphics Layer</option>
      <option value="feature">Feature Layer (enable clustering)</option>
      <option value="csv">CSV Layer (enable clustering)</option>
      <option value="feature-collection">Feature Layer (Collection)</option>
      <option value="client-side">Feature Layer (Client-Side)</option>
    </select>
  </div>

  <div class="control-group">
    <label for="symbolType">Symbol Type:</label>
    <select id="symbolType" [ngModel]="selectedSymbolType" (ngModelChange)="onSymbolTypeChange($event)" [disabled]="isLoading">
      <option value="simple-marker">Simple Marker (Point)</option>
      <option value="circle">Circle</option>
      <option value="square">Square</option>
      <option value="diamond">Diamond</option>
      <option value="cross">Cross</option>
      <option value="x">X Symbol</option>
      <option value="triangle">Triangle</option>
      <option value="picture-marker">Picture Marker (SVG)</option>
      <option value="complex-svg">Complex SVG</option>
      <option value="png-image">Custom Icon (Different per layer)</option>
    </select>
  </div>

  <app-clustering-type-selector
    [selectedType]="selectedClusteringType"
    [disabled]="isLoading"
    (typeChange)="onClusteringTypeChange($event)">
  </app-clustering-type-selector>

  <app-analysis-method-selector
    [selectedMethod]="selectedAnalysisMethod"
    [disabled]="isLoading"
    (methodChange)="onAnalysisMethodChange($event)">
  </app-analysis-method-selector>

  <app-entities-input-with-total
    [entitiesAmount]="entitiesAmount"
    [totalLayers]="22"
    [disabled]="isLoading"
    (entitiesChange)="onEntitiesAmountChange($event)">
  </app-entities-input-with-total>

  <button 
    class="apply-button" 
    (click)="onApplySettings()" 
    [disabled]="isLoading">
    Apply Settings
  </button>

  <app-status-info
    [activeLayerCount]="activeLayerCount"
    [totalEntities]="getActiveEntitiesCount()"
    [layerTypeName]="getLayerTypeName()"
    [symbolTypeName]="getSymbolTypeName()"
    [totalLoadingTime]="totalLoadingTime"
    [lastLoadedTime]="lastLoadedTime">
  </app-status-info>

  <app-history-section
    [history]="history"
    [isExpanded]="isHistoryExpanded"
    (toggle)="onHistoryToggle()"
    (clear)="onClearHistory()">
  </app-history-section>
</div>
