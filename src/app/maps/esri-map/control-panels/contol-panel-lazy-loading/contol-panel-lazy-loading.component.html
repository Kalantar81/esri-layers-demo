<div class="control-panel">
  <h3>Lazy Loading Settings</h3>

  <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
    <app-layer-type-selector [control]="$any(settingsForm.get('layerType'))"></app-layer-type-selector>
    <app-symbol-type-selector [control]="$any(settingsForm.get('symbolType'))"></app-symbol-type-selector>
    <app-entities-input [control]="$any(settingsForm.get('entitiesPerLayer'))"></app-entities-input>
    <app-clustering-controls [formGroup]="settingsForm"></app-clustering-controls>
    <app-bulk-amount-input [control]="$any(settingsForm.get('bulkAmount'))"></app-bulk-amount-input>

    <button type="submit" class="apply-button">
      Apply Settings
    </button>
  </form>

  <app-status-info
    [activeLayerCount]="activeLayerCount"
    [totalEntities]="getActiveEntitiesCount()"
    [layerTypeName]="getLayerTypeName()"
    [symbolTypeName]="getSymbolTypeName()"
    [totalLoadingTime]="totalLoadingTime"
    [lastLoadedTime]="lastLoadedTime">
  </app-status-info>

  <app-history-section
    [history]="history"
    [isExpanded]="isHistoryExpanded"
    (toggle)="onHistoryToggle()"
    (clear)="onClearHistory()">
  </app-history-section>
</div>
