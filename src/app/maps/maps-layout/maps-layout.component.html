<div class="maps-layout">
  <!-- Header with Toolbar -->
  <p-toolbar class="maps-header toolbar">
    <div class="toolbar-left">
      <h2>ESRI Layers Demo</h2>
    </div>
    
    <div class="toolbar-middle">
      <!-- Layers Toggle Button -->
      <button 
        pButton 
        type="button" 
        icon="pi pi-layer-plus" 
        label="Layers"
        [pTooltip]="'Toggle all layers visibility'"
        tooltipPosition="bottom"
        (click)="onLayersToggle()"
        [class.active]="layerMode === 'layers'"
        class="toolbar-btn">
      </button>

      <!-- Lazy Loading Button -->
      <button 
        pButton 
        type="button" 
        icon="pi pi-cloud-download" 
        label="Lazy Loading"
        [pTooltip]="'Enable/Disable lazy loading of layers'"
        tooltipPosition="bottom"
        (click)="onLazyLoadingToggle()"
        [class.active]="layerMode === 'lazy-loading'"
        class="toolbar-btn">
      </button>

      <!-- Clustering Button -->
      <button 
        pButton 
        type="button" 
        icon="pi pi-sitemap" 
        label="Clustering"
        [pTooltip]="'Enable/Disable clustering of layer entities'"
        tooltipPosition="bottom"
        (click)="onClusteringToggle()"
        [class.active]="layerMode === 'clustering'"
        class="toolbar-btn">
      </button>
    </div>

    <div class="toolbar-right">
      <span class="mode-indicator">Mode: <strong>{{ getModeLabel() }}</strong></span>
    </div>
  </p-toolbar>

  <!-- Body with Map and Control Panel -->
  <main class="maps-body">
    <!-- Map Component -->
    <app-esri-map
      #esriMap
    ></app-esri-map>
  </main>
</div>
